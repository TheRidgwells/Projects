name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Key files exist
        run: |
          set -euo pipefail
          for f in index.html 404.html CNAME favicon.ico apple-touch-icon.png site.webmanifest changelogs/index.html changelog/index.html assets/js/changelogs.js legal/index.html legal/privacy/index.html legal/terms/index.html legal/cookies/index.html legal/imprint/index.html legal/disclaimer/index.html legal/opt-out/index.html sitemap.xml sitemap/index.html robots.txt README.md CHANGELOG.md VERSION.md CONTRIBUTING.md commit.sh commit.bat dev-server.sh dev-server.bat tests/version.sh tests/site.test.js; do
            if [ ! -f "$f" ]; then echo "::error::Missing $f"; exit 1; fi
          done
      - name: HTML parses and local links resolve
        run: |
          python3 - <<'PY'
          import html.parser, os, sys, urllib.parse
          bad = []
          class P(html.parser.HTMLParser):
              def __init__(s, f):
                  super().__init__(); s.f = f
              def handle_starttag(s, tag, attrs):
                  for k, v in attrs:
                      if k not in ("href", "src") or not v:
                          continue
                      u = urllib.parse.urlparse(v)
                      if u.scheme or v.startswith(("//", "#", "mailto:", "tel:", "data:", "javascript:")) or "{" in v or "<%" in v:
                          continue
                      path = urllib.parse.unquote(u.path)
                      if not path:
                          continue
                      base = "." if path.startswith("/") else os.path.dirname(s.f)
                      t = os.path.normpath(os.path.join(base, path.lstrip("/")))
                      if not (os.path.isfile(t) or os.path.isfile(os.path.join(t, "index.html")) or os.path.isfile(t + ".html")):
                          bad.append(f"{s.f}: broken local link {v}")
          files = []
          for root, dirs, fs in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "node_modules", ".github")]
              files += [os.path.join(root, f) for f in fs if f.endswith(".html")]
          for f in files:
              P(f).feed(open(f, encoding="utf-8").read())
          print(f"Checked {len(files)} HTML file(s)")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          PY
      - name: Workflow YAML is valid
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml; do yq e 'true' "$f" > /dev/null && echo "ok $f"; done

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for the "no going back to 0.x.y" rule
      - name: VERSION.md, CHANGELOG.md and the commit script's version rules
        run: bash tests/version.sh

  tests:
    name: Site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: tests/site.test.js
        run: node tests/site.test.js
